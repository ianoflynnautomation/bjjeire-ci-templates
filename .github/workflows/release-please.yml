name: Release Please (Reusable)

# Runs release-please in either mode — single-package (`release-type`) or
# manifest/monorepo (`config-file` + `manifest-file`) — and normalises the two
# very different output shapes into one contract: `releases-created`,
# `paths-released` (JSON array) and `tags-released` (JSON object of path -> tag).
#
# On top of that it offers the two things every consumer re-implements by hand:
#   * move-major-tag — force-move the floating vMAJOR tag onto the new release,
#     so downstream repos pinned to @v1 pick up non-breaking updates.
#   * dispatch-workflow — fire a workflow_dispatch once per released path with
#     that path's tag, which is how a chart/package monorepo publishes only the
#     components that actually released.
#
# Required caller permissions:
#   contents: write        # create releases and tags
#   pull-requests: write   # maintain the release PR
#   actions: write         # only when dispatch-workflow is set

on:
  workflow_call:
    inputs:
      release-type:
        description: >-
          release-please strategy for single-package repos, e.g. "simple",
          "node", "java", "helm". Leave empty to run in manifest mode using
          config-file + manifest-file, which is the only mode that supports
          several independently versioned packages in one repo.
        required: false
        type: string
        default: ""
      config-file:
        description: "Manifest-mode release-please config. Ignored when release-type is set."
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "Manifest-mode version manifest. Ignored when release-type is set."
        required: false
        type: string
        default: ".release-please-manifest.json"
      target-branch:
        description: "Branch release-please releases from. Empty uses the repository default branch."
        required: false
        type: string
        default: ""
      move-major-tag:
        description: >-
          Force-move the floating vMAJOR tag (v1, v2, …) to the new release.
          Only meaningful for single-package repos where a top-level tag exists;
          in manifest mode with several packages there is no single major to
          move and the job self-skips with a notice.
        required: false
        type: boolean
        default: false
      dispatch-workflow:
        description: >-
          Workflow file name (e.g. "publish-chart.yml") to trigger once per
          released path, with that path's tag. Empty disables dispatching. The
          target workflow must declare workflow_dispatch and the input named by
          dispatch-input-name.
        required: false
        type: string
        default: ""
      dispatch-input-name:
        description: "Name of the workflow_dispatch input the released tag is passed as."
        required: false
        type: string
        default: "tag"
      dispatch-path-input-name:
        description: "Optional second workflow_dispatch input carrying the released path (e.g. the chart directory). Empty passes only the tag."
        required: false
        type: string
        default: ""
      dispatch-ref:
        description: "Ref the dispatched workflow runs from. Empty uses the repository default branch."
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner label for every job."
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout applied to each job."
        required: false
        type: number
        default: 10
    secrets:
      release-token:
        description: >-
          Token release-please authenticates with. Defaults to the caller's
          GITHUB_TOKEN. Supply a PAT or GitHub App token when the release PR
          must itself trigger other workflows — GITHUB_TOKEN-authored commits
          deliberately do not.
        required: false
      dispatch-token:
        description: "Token used for `gh workflow run`. Defaults to the caller's GITHUB_TOKEN, which is sufficient: workflow_dispatch fires normally when triggered by GITHUB_TOKEN."
        required: false
    outputs:
      releases-created:
        description: '"true" when at least one release was cut in this run.'
        value: ${{ jobs.release.outputs.releases-created }}
      tag-name:
        description: "Tag of the release, for single-package repos. Empty in manifest mode with more than one released package — use tags-released."
        value: ${{ jobs.release.outputs.tag-name }}
      major:
        description: "Major version of the release, for single-package repos."
        value: ${{ jobs.release.outputs.major }}
      minor:
        description: "Minor version of the release, for single-package repos."
        value: ${{ jobs.release.outputs.minor }}
      patch:
        description: "Patch version of the release, for single-package repos."
        value: ${{ jobs.release.outputs.patch }}
      paths-released:
        description: 'JSON array of the package paths that released, e.g. ["charts/api","charts/web"]. Feed it to a matrix with fromJSON().'
        value: ${{ jobs.release.outputs.paths-released }}
      tags-released:
        description: 'JSON object mapping each released path to its tag, e.g. {"charts/api":"api-v1.2.3"}.'
        value: ${{ jobs.release.outputs.tags-released }}

jobs:
  release:
    name: Release Please
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases-created: ${{ steps.normalize.outputs.releases-created }}
      tag-name: ${{ steps.normalize.outputs.tag-name }}
      major: ${{ steps.normalize.outputs.major }}
      minor: ${{ steps.normalize.outputs.minor }}
      patch: ${{ steps.normalize.outputs.patch }}
      paths-released: ${{ steps.normalize.outputs.paths-released }}
      tags-released: ${{ steps.normalize.outputs.tags-released }}
    steps:
      # Two invocations rather than one: the action takes either release-type or
      # config-file/manifest-file, and passing an empty value for the unused one
      # is not a documented no-op. Exactly one of these ever runs.
      - name: Release Please (manifest mode)
        id: manifest
        if: inputs.release-type == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.release-token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

      - name: Release Please (single package)
        id: simple
        if: inputs.release-type != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.release-token || github.token }}
          release-type: ${{ inputs.release-type }}
          target-branch: ${{ inputs.target-branch }}

      - name: Normalize release outputs
        id: normalize
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
          RAW_MANIFEST: ${{ toJSON(steps.manifest.outputs) }}
          RAW_SIMPLE: ${{ toJSON(steps.simple.outputs) }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_TYPE" ]; then raw="$RAW_SIMPLE"; else raw="$RAW_MANIFEST"; fi
          if [ -z "$raw" ] || [ "$raw" = "null" ]; then raw='{}'; fi

          # Manifest mode emits releases_created plus one "<path>--<field>" output
          # per package; single-package mode emits release_created/tag_name/major.
          released="$(jq -r '(.releases_created // .release_created // "false") | tostring' <<< "$raw")"
          paths="$(jq -c '
            if .paths_released then
              (.paths_released | if type == "string" then fromjson else . end)
            elif ((.release_created // "false") | tostring) == "true" then ["."]
            else [] end' <<< "$raw")"
          tags="$(jq -c --argjson paths "$paths" '
            . as $o
            | reduce $paths[] as $p ({}; .[$p] = ($o[$p + "--tag_name"] // $o.tag_name // ""))
            | with_entries(select(.value != ""))' <<< "$raw")"

          {
            echo "releases-created=${released}"
            echo "tag-name=$(jq -r '.tag_name // ""' <<< "$raw")"
            echo "major=$(jq -r '.major // ""' <<< "$raw")"
            echo "minor=$(jq -r '.minor // ""' <<< "$raw")"
            echo "patch=$(jq -r '.patch // ""' <<< "$raw")"
            echo "paths-released=${paths}"
            echo "tags-released=${tags}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release Please"
            echo ""
            echo "Releases created: **${released}**"
            echo ""
            if [ "$tags" != "{}" ]; then
              echo "| Path | Tag |"
              echo "| --- | --- |"
              jq -r 'to_entries[] | "| `\(.key)` | `\(.value)` |"' <<< "$tags"
            else
              echo "No release was cut in this run — the release PR was created or updated instead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Release Please::released=${released} paths=${paths}"

  major-tag:
    name: Move floating major tag
    needs: release
    if: ${{ inputs.move-major-tag && needs.release.outputs.releases-created == 'true' && needs.release.outputs.major != '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Force-move vMAJOR tag to the new release
        env:
          MAJOR: ${{ needs.release.outputs.major }}
          TAG_NAME: ${{ needs.release.outputs.tag-name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "v${MAJOR}" "${TAG_NAME}^{}" -m "Release ${TAG_NAME}"
          git push origin "v${MAJOR}" --force
          echo "::notice title=Release::v${MAJOR} now points at ${TAG_NAME}"
          echo "Floating tag \`v${MAJOR}\` now points at \`${TAG_NAME}\`." >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Dispatch downstream workflow
    needs: release
    if: ${{ inputs.dispatch-workflow != '' && needs.release.outputs.releases-created == 'true' && needs.release.outputs.tags-released != '{}' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      actions: write
    steps:
      - name: Dispatch once per released path
        env:
          GH_TOKEN: ${{ secrets.dispatch-token || github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS_RELEASED: ${{ needs.release.outputs.tags-released }}
          WORKFLOW: ${{ inputs.dispatch-workflow }}
          TAG_INPUT: ${{ inputs.dispatch-input-name }}
          PATH_INPUT: ${{ inputs.dispatch-path-input-name }}
          DISPATCH_REF: ${{ inputs.dispatch-ref }}
        run: |
          set -euo pipefail
          rows=""
          while IFS=$'\t' read -r path tag; do
            [ -n "$tag" ] || continue
            args=(workflow run "$WORKFLOW" --field "${TAG_INPUT}=${tag}")
            [ -n "$PATH_INPUT" ] && args+=(--field "${PATH_INPUT}=${path}")
            [ -n "$DISPATCH_REF" ] && args+=(--ref "$DISPATCH_REF")

            echo "::notice title=Dispatching::${WORKFLOW} ${TAG_INPUT}=${tag}"
            gh "${args[@]}"
            rows+="| \`${path}\` | \`${tag}\` |"$'\n'
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' <<< "$TAGS_RELEASED")

          {
            echo "### Dispatched \`${WORKFLOW}\`"
            echo ""
            echo "| Path | Tag |"
            echo "| --- | --- |"
            printf '%s' "$rows"
          } >> "$GITHUB_STEP_SUMMARY"
