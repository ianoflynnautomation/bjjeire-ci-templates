name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint Workflows & Actions
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/lint-workflows.yml
    with:
      zizmor-paths: ".github/workflows/ actions/ examples/"

  shellcheck:
    name: Shellcheck Action Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find actions -type f -name '*.sh' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::notice title=Shellcheck::No action scripts found"
            exit 0
          fi
          echo "::group::Scripts checked"
          printf '  %s\n' "${scripts[@]}"
          echo "::endgroup::"
          shellcheck --severity=style --format=gcc "${scripts[@]}"
          echo "::notice title=Shellcheck::${#scripts[@]} script(s) clean"

  audit_report:
    name: Audit Report Generator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: actions/generate-executive-test-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: actions/generate-executive-test-report/requirements-dev.txt
      - name: Install and test
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - name: Preview report (no viewer)
        run: |
          set -euo pipefail
          python preview_report.py --clean --no-open
          test -s out/audit-release-report.pdf
          test -s out/summary.md
          python -c 'import json; v=json.load(open("out/verdict.json")); print(v["release_id"], v["verdict"], len(v["catalog"]))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: audit-report-preview
          path: |
            actions/generate-executive-test-report/out/audit-release-report.pdf
            actions/generate-executive-test-report/out/summary.md
            actions/generate-executive-test-report/out/verdict.json
          if-no-files-found: warn
          retention-days: 7
