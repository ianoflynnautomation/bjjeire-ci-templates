name: Acceptance Gate (Reusable)

# Orchestrates deploy → test → teardown for an environment that may be
# ephemeral (Flux ResourceSet from a Static InputProvider) or already exist
# (tests only). GitHub Actions must not kubectl-apply ResourceQuota.
#
# Required caller permissions (superset of every job below — GitHub rejects
# the run at parse time if the caller grants less):
#   contents: read
#   actions: read
#   packages: read        # playwright-tests, private runner image
#   id-token: write
#   pages: write          # playwright-tests validates the tree even when publish-report is false
#
# No top-level concurrency — put it on the caller only.

on:
  workflow_call:
    inputs:
      mode:
        description: "ephemeral (create → test → destroy) | existing (tests only)."
        type: string
        required: false
        default: "ephemeral"
      env-id:
        description: "Environment / namespace id. Required when mode=ephemeral."
        type: string
        required: false
        default: ""
      image-tag:
        description: "Container tag for api/frontend/seeder. Required when mode=ephemeral."
        type: string
        required: false
        default: ""
      cluster-resource-group:
        description: "Azure RG containing the AKS cluster. Required when mode=ephemeral."
        type: string
        required: false
        default: ""
      cluster-name:
        description: "AKS cluster name. Required when mode=ephemeral."
        type: string
        required: false
        default: ""
      cluster-domain:
        description: "Per-cluster DNS suffix (e.g. dev.bjjeire.com). Used for CLUSTER_DOMAIN in sha-env."
        type: string
        required: false
        default: ""
      root-domain:
        description: "Zone apex used for public preview/SHA hostnames (e.g. bjjeire.com). Cloudflare Universal SSL covers *.root-domain. Defaults to cluster-domain."
        type: string
        required: false
        default: ""
      gitops-repo:
        description: "Unused. Ephemeral envs are Flux-owned; kept so existing callers do not break."
        type: string
        required: false
        default: "ianoflynnautomation/bjjeire-gitops"
      gitops-ref:
        description: "Unused. Ephemeral envs are Flux-owned; kept so existing callers do not break."
        type: string
        required: false
        default: "main"
      sha-env-path:
        description: "Unused. CI no longer kubectl-applies sha-env manifests."
        type: string
        required: false
        default: "kubernetes/apps/base/bjj-eire-preview/sha-env/manifests.yaml"
      values-path:
        description: "Unused. Flux copies bjj-eire-ephemeral-values from flux-system."
        type: string
        required: false
        default: "kubernetes/apps/base/bjj-eire-preview/controller/values-ephemeral.yaml"
      resourceset-name:
        description: "Flux ResourceSet that renders PR and SHA ephemeral envs."
        type: string
        required: false
        default: "bjj-eire-previews"
      resourceset-namespace:
        description: "Namespace of the ResourceSet and SHA InputProviders."
        type: string
        required: false
        default: "flux-system"
      base-url:
        description: "Frontend URL when mode=existing. Ignored for ephemeral (taken from env_up)."
        type: string
        required: false
        default: ""
      api-url:
        description: "API URL when mode=existing. Ignored for ephemeral (taken from env_up)."
        type: string
        required: false
        default: ""
      test-tags:
        description: "Playwright grep filter."
        type: string
        required: false
        default: "@acceptance"
      shard-total:
        description: >-
          Default number of shards per Playwright project. Recommended 4 on a
          D8ds_v6 runner pool. Use project-shard-overrides for smaller projects.
        type: number
        required: false
        default: 4
      project-shard-overrides:
        description: >-
          Newline-separated `project=count` overrides. Projects not listed use
          shard-total. Empty leaves every project at shard-total.
        type: string
        required: false
        default: ""
      playwright-projects:
        description: "Newline-separated Playwright project names."
        type: string
        required: false
        default: |
          api
          chromium-desktop
          firefox-desktop
          webkit-desktop
          snapshots
          a11y
          mobile-iphone
      keep-on-failure:
        description: "When true (default), a failed suite leaves the ephemeral namespace for debugging (TTL janitor is the backstop)."
        type: boolean
        required: false
        default: true
      ttl:
        description: "Janitor TTL annotation applied to the ephemeral namespace."
        type: string
        required: false
        default: "4h"
      test-repo:
        description: "Owner/repo holding the test code."
        type: string
        required: false
        default: "ianoflynnautomation/bjjeire-tests"
      test-repo-ref:
        description: "Git ref of the test repo to check out."
        type: string
        required: false
        default: "main"
      runs-on:
        description: "Runner label for env lifecycle + Playwright shards."
        type: string
        required: false
        default: "gha-runner-scale-set"
      report-runs-on:
        description: "Runner label for report merge / gate jobs."
        type: string
        required: false
        default: "ubuntu-latest"
      fail-on-flaky:
        description: "Fail the suite when any test passed only after a retry."
        type: boolean
        required: false
        default: true
      fail-fast:
        description: >-
          Cancel remaining Playwright shards when one fails. Keep false so a
          misconfigured env or infra blip on one shard still yields reports
          from the others.
        type: boolean
        required: false
        default: false
      max-parallel:
        description: >-
          Cap concurrent shard jobs. Recommended 8 on D8ds_v6 (32 GiB). Use 1
          only on a single D2-class node.
        type: number
        required: false
        default: 8
      publish-report:
        description: "Publish the merged HTML report to GitHub Pages."
        type: boolean
        required: false
        default: false
      package-audit-reports:
        description: "Package merged Playwright JSON/JUnit for audit-report.yml."
        type: boolean
        required: false
        default: false
      package-audit-source:
        description: "Source label for the report-bundle artifact. Empty uses the Playwright artifact-prefix."
        type: string
        required: false
        default: ""
      package-audit-category:
        description: "Audit category for the merged Playwright results (system, acceptance, or api)."
        type: string
        required: false
        default: "system"
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      GHCR_TOKEN:
        required: false
      test-env-vars:
        required: false
    outputs:
      test-status:
        description: "success | failure — result of the tests job."
        value: ${{ jobs.tests.outputs.status }}
      namespace:
        description: "Kubernetes namespace the env was deployed into."
        value: ${{ jobs.env_up.outputs.namespace }}
      failed-count:
        description: "Number of failed tests across all shards (0 on green)."
        value: ${{ jobs.tests.outputs.failed-count }}
      report-artifact-name:
        description: "Name of the merged HTML report artifact."
        value: ${{ jobs.tests.outputs.report-artifact-name }}

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  env_up:
    name: Deploy acceptance env
    if: inputs.mode == 'ephemeral'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      base_url: ${{ steps.wait.outputs.base-url }}
      api_base_url: ${{ steps.wait.outputs.api-url }}
      internal_api_url: ${{ steps.wait.outputs.internal-api-url }}
      internal_base_url: ${{ steps.wait.outputs.internal-base-url }}
      namespace: ${{ steps.wait.outputs.namespace }}
    steps:
      - name: Log in to AKS
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/azure-aks-login@d0f389bf22e50d9458f4cbcb1938d716b59b0f74  # v1.4.3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ inputs.cluster-resource-group }}
          cluster-name: ${{ inputs.cluster-name }}
          install-helm: "false"

      - name: Request SHA env from Flux
        env:
          ENV_ID: ${{ inputs.env-id }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          CLUSTER_DOMAIN: ${{ inputs.cluster-domain }}
          ROOT_DOMAIN: ${{ inputs.root-domain != '' && inputs.root-domain || inputs.cluster-domain }}
          TTL: ${{ inputs.ttl }}
          RESOURCESET: ${{ inputs.resourceset-name }}
          RESOURCESET_NS: ${{ inputs.resourceset-namespace }}
        run: |
          set -euo pipefail
          : "${ENV_ID:?}" "${IMAGE_TAG:?}" "${CLUSTER_DOMAIN:?}" "${ROOT_DOMAIN:?}" "${TTL:?}"
          if [[ ! "${ENV_ID}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error title=Invalid env-id::${ENV_ID} is not a DNS-1123 label (max 63 chars)"
            exit 1
          fi
          case "${IMAGE_TAG}${CLUSTER_DOMAIN}${ROOT_DOMAIN}${TTL}${RESOURCESET}${RESOURCESET_NS}" in
            *$'\n'*|*$'\r'*) echo "::error title=Invalid input::values must be single-line"; exit 1 ;;
          esac
          kubectl apply --server-side --field-manager=gha -f - <<YAML
          apiVersion: fluxcd.controlplane.io/v1
          kind: ResourceSetInputProvider
          metadata:
            name: ${ENV_ID}
            namespace: ${RESOURCESET_NS}
            labels:
              bjjeire.io/sha-env: "true"
              bjjeire.io/ephemeral: "true"
            annotations:
              janitor/ttl: "${TTL}"
              fluxcd.controlplane.io/reconcileEvery: "1m"
          spec:
            type: Static
            defaultValues:
              ns: "${ENV_ID}"
              imageTag: "${IMAGE_TAG}"
              ttl: "${TTL}"
              clusterDomain: "${CLUSTER_DOMAIN}"
              rootDomain: "${ROOT_DOMAIN}"
          YAML
          kubectl wait --for=condition=Ready \
            -n "${RESOURCESET_NS}" \
            --timeout=2m \
            "resourcesetinputprovider/${ENV_ID}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl -n "${RESOURCESET_NS}" annotate resourceset "${RESOURCESET}" \
            "reconcile.fluxcd.io/requestedAt=${now}" --overwrite
          kubectl wait "namespace/${ENV_ID}" --for=jsonpath='{.status.phase}'=Active --timeout=3m

      - name: Wait for HelmRelease
        id: wait
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/flux-wait-helmrelease@6bba6a07ce3357aa8daeb0cb909a5b0b7ccbc5eb  # v1.6.1
        with:
          namespace: ${{ inputs.env-id }}
          name: bjj-eire
          timeout: 10m
          cluster-domain: ${{ inputs.root-domain != '' && inputs.root-domain || inputs.cluster-domain }}
          env-id: ${{ inputs.env-id }}

      - name: Collect diagnostics
        if: failure()
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/collect-k8s-diagnostics@d0f389bf22e50d9458f4cbcb1938d716b59b0f74  # v1.4.3
        with:
          namespace: ${{ inputs.env-id }}
          helm-release: bjj-eire
          flux-helmrelease: bjj-eire
          upload-artifact: "true"
          artifact-name: k8s-diagnostics-${{ inputs.env-id }}

  tests:
    name: Run acceptance suite
    needs: [env_up]
    if: |
      always() &&
      (needs.env_up.result == 'success' ||
       (inputs.mode == 'existing' && needs.env_up.result == 'skipped'))
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      pages: write
    uses: ./.github/workflows/playwright-tests.yml
    with:
      app-env: staging
      # Ephemeral: keep public HTTPS origins so the SPA/MSAL boot, but pin
      # those hostnames to the in-cluster Istio gateway (PIN_CLUSTER_GATEWAY)
      # so Playwright never crosses Cloudflare Bot Fight.
      base-url: ${{ inputs.mode == 'existing' && inputs.base-url || needs.env_up.outputs.base_url }}
      api-url: ${{ inputs.mode == 'existing' && inputs.api-url || needs.env_up.outputs.api_base_url }}
      env-vars: ${{ inputs.mode == 'ephemeral' && 'PIN_CLUSTER_GATEWAY=true' || '' }}
      test-repo: ${{ inputs.test-repo }}
      test-repo-ref: ${{ inputs.test-repo-ref }}
      test-tags: ${{ inputs.test-tags }}
      shard-total: ${{ inputs.shard-total }}
      project-shard-overrides: ${{ inputs.project-shard-overrides }}
      playwright-projects: ${{ inputs.playwright-projects }}
      config-map: |
        api=playwright.api.config.ts
      default-config: playwright.ui.config.ts
      project-env-overrides: ${{ inputs.mode == 'ephemeral' && format('api:API_URL={0}\napi:CF_ACCESS_CLIENT_ID=\napi:CF_ACCESS_CLIENT_SECRET=', needs.env_up.outputs.internal_api_url) || '' }}
      runs-on: ${{ inputs.runs-on }}
      report-runs-on: ${{ inputs.report-runs-on }}
      fail-on-flaky: ${{ inputs.fail-on-flaky }}
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      publish-report: ${{ inputs.publish-report }}
      package-audit-reports: ${{ inputs.package-audit-reports }}
      package-audit-source: ${{ inputs.package-audit-source }}
      package-audit-category: ${{ inputs.package-audit-category }}
    secrets:
      test-env-vars: ${{ secrets.test-env-vars }}

  env_down:
    name: Destroy acceptance env
    needs: [env_up, tests]
    if: |
      always() &&
      inputs.mode == 'ephemeral' &&
      needs.env_up.result == 'success' &&
      (needs.tests.result == 'success' || inputs.keep-on-failure == false)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/flux-ephemeral-teardown.yml
    with:
      env-id: ${{ inputs.env-id }}
      cluster-resource-group: ${{ inputs.cluster-resource-group }}
      cluster-name: ${{ inputs.cluster-name }}
      helm-release: bjj-eire
      flux-helmrelease: bjj-eire
      input-provider: ${{ inputs.env-id }}
      input-provider-namespace: ${{ inputs.resourceset-namespace }}
      resourceset-name: ${{ inputs.resourceset-name }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  gate:
    name: Acceptance gate
    runs-on: ${{ inputs.report-runs-on }}
    timeout-minutes: 5
    permissions: {}
    needs: [env_up, tests, env_down]
    if: always()
    steps:
      - name: Evaluate result
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ENV_UP: ${{ needs.env_up.result }}
          TESTS: ${{ needs.tests.result }}
          ENV_DOWN: ${{ needs.env_down.result }}
          ENV_ID: ${{ inputs.env-id }}
          TTL: ${{ inputs.ttl }}
          KEEP: ${{ inputs.keep-on-failure }}
        run: |
          set -euo pipefail
          echo "mode=${MODE} env_up=${ENV_UP} tests=${TESTS} env_down=${ENV_DOWN}"
          if [ "${MODE}" = "ephemeral" ] && [ "${ENV_UP}" != "success" ]; then
            echo "::error title=Acceptance failed::env_up did not succeed"
            exit 1
          fi
          if [ "${TESTS}" != "success" ]; then
            if [ "${MODE}" = "ephemeral" ]; then
              echo "::error title=Acceptance failed::tests did not pass — namespace ${ENV_ID} kept alive (TTL ${TTL}, keep-on-failure=${KEEP}). Re-run failed jobs retries against the same env; or push a fix for a fresh one."
            else
              echo "::error title=Acceptance failed::tests did not pass against the existing environment"
            fi
            exit 1
          fi
          if [ "${ENV_DOWN}" = "failure" ]; then
            echo "::warning title=Teardown failed::destroy ran but failed for ${ENV_ID} — TTL janitor will reap the namespace within ${TTL}"
          fi
          echo "::notice title=Acceptance gate::PASS"
