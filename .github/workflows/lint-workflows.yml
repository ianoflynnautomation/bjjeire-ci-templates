name: Lint Workflows (Reusable)

# Shared actionlint + zizmor + deprecated-command gate for GitHub Actions
# workflows, plus an optional yamllint pass.
#
# actionlint skips generated GitHub Agentic Workflow lock files (*.lock.yml)
# by default: gh-aw emits concurrency.queue, which actionlint 1.7 treats as a
# syntax error. zizmor still scans those files after they are restored.
#
# Required caller permissions:
#   contents: read
#   checks: write

on:
  workflow_call:
    inputs:
      zizmor-paths:
        description: "Space-separated paths scanned by zizmor and the deprecated-command grep."
        required: false
        type: string
        default: ".github/workflows/"
      zizmor-version:
        description: "zizmor version installed via pipx."
        required: false
        type: string
        default: "1.26.1"
      zizmor-args:
        description: "Extra zizmor arguments, e.g. '--offline --min-severity high'."
        required: false
        type: string
        default: ""
      zizmor-enforce:
        description: "When false, zizmor findings are reported but do not fail the job."
        required: false
        type: boolean
        default: true
      actionlint-fail-level:
        description: "reviewdog fail_level for actionlint."
        required: false
        type: string
        default: "error"
      actionlint-exclude:
        description: >-
          Space-separated globs under .github/workflows that actionlint skips.
          Defaults to generated GitHub Agentic Workflow lock files (*.lock.yml),
          which actionlint 1.7 rejects for compiler-only keys such as
          concurrency.queue. Pass an empty string to lint every workflow file.
        required: false
        type: string
        default: "*.lock.yml"
      yamllint:
        description: "Run yamllint as a sibling job. Requires a config file at yamllint-config in the caller repo."
        required: false
        type: boolean
        default: false
      yamllint-paths:
        description: "Space-separated paths linted by yamllint."
        required: false
        type: string
        default: ".github/workflows/"
      yamllint-config:
        description: "Path to the yamllint config file in the caller repo. Ignored when yamllint-config-data is set."
        required: false
        type: string
        default: ".yamllint.yml"
      yamllint-config-data:
        description: >-
          Inline yamllint configuration (YAML). Takes precedence over
          yamllint-config, for repos that keep the ruleset in the caller
          workflow instead of a committed dotfile. Empty uses yamllint-config.
        required: false
        type: string
        default: ""
      yamllint-version:
        description: "yamllint version installed via pipx."
        required: false
        type: string
        default: "1.35.1"
      yamllint-strict:
        description: "Pass --strict to yamllint: warnings are treated as errors and fail the job."
        required: false
        type: boolean
        default: false
      yamllint-enforce:
        description: "When false, yamllint findings are reported but do not fail the job."
        required: false
        type: boolean
        default: true
      runs-on:
        description: "Runner label for the lint job."
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Park generated workflow files actionlint cannot parse
        id: park_lock
        shell: bash
        env:
          EXCLUDE: ${{ inputs.actionlint-exclude }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          park="${RUNNER_TEMP}/actionlint-parked-workflows"
          mkdir -p "$park"
          parked=0
          if [ -n "$EXCLUDE" ]; then
            # Intentional word-split and glob: EXCLUDE is a space-separated glob list.
            # shellcheck disable=SC2086
            for pattern in $EXCLUDE; do
              case "$pattern" in
                *..*|/*|~*)
                  echo "::error title=actionlint-exclude::Refusing pattern '${pattern}'; globs must stay under .github/workflows"
                  exit 1
                  ;;
              esac
              # shellcheck disable=SC2086
              for f in .github/workflows/$pattern; do
                [ -f "$f" ] || continue
                mv "$f" "$park/"
                parked=$((parked + 1))
                echo "parked ${f}"
              done
            done
          fi
          echo "parked=${parked}" >> "$GITHUB_OUTPUT"
          echo "::notice title=actionlint::Skipped ${parked} generated workflow file(s) matching '${EXCLUDE:-<none>}'"
      - name: Run actionlint
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e  # v1.74.0
        with:
          fail_level: ${{ inputs.actionlint-fail-level }}
          reporter: github-check
      - name: Restore parked workflow files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          park="${RUNNER_TEMP}/actionlint-parked-workflows"
          files=("$park"/*)
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          mv "${files[@]}" .github/workflows/
      - name: Zizmor (Actions security scan)
        continue-on-error: ${{ !inputs.zizmor-enforce }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
          ZIZMOR_ARGS: ${{ inputs.zizmor-args }}
          ZIZMOR_PATHS: ${{ inputs.zizmor-paths }}
        run: |
          set -euo pipefail
          read -ra args <<< "$ZIZMOR_ARGS"
          read -ra paths <<< "$ZIZMOR_PATHS"
          pipx run "zizmor==${ZIZMOR_VERSION}" --format plain "${args[@]}" "${paths[@]}"
      - name: Check for deprecated workflow commands
        shell: bash
        env:
          SCAN_PATHS: ${{ inputs.zizmor-paths }}
        run: |
          set -euo pipefail
          read -ra paths <<< "$SCAN_PATHS"
          if grep -rnE '::set-(output|env)::' "${paths[@]}"; then
            echo "::error title=Deprecated commands::Use \$GITHUB_OUTPUT / \$GITHUB_ENV instead of ::set-output / ::set-env"
            exit 1
          fi
          echo "::notice title=Lint::No deprecated workflow commands found"
      - name: Write lint summary
        if: always()
        shell: bash
        env:
          ZIZMOR_ENFORCE: ${{ inputs.zizmor-enforce }}
          ZIZMOR_PATHS: ${{ inputs.zizmor-paths }}
          ACTIONLINT_EXCLUDE: ${{ inputs.actionlint-exclude }}
        run: |
          {
            echo "### Workflow lint"
            echo ""
            echo "| Check | Scope |"
            echo "| --- | --- |"
            echo "| actionlint | \`.github/workflows\` except \`${ACTIONLINT_EXCLUDE:-<none>}\` (reviewdog) |"
            echo "| zizmor | \`${ZIZMOR_PATHS}\` (enforce=${ZIZMOR_ENFORCE}) |"
            echo "| deprecated commands | \`${ZIZMOR_PATHS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  yamllint:
    name: yamllint
    if: inputs.yamllint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run yamllint
        continue-on-error: ${{ !inputs.yamllint-enforce }}
        shell: bash
        env:
          YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
          YAMLLINT_CONFIG: ${{ inputs.yamllint-config }}
          YAMLLINT_CONFIG_DATA: ${{ inputs.yamllint-config-data }}
          YAMLLINT_PATHS: ${{ inputs.yamllint-paths }}
          YAMLLINT_STRICT: ${{ inputs.yamllint-strict }}
        run: |
          set -euo pipefail
          read -ra paths <<< "$YAMLLINT_PATHS"
          args=(--format github)
          if [ "$YAMLLINT_STRICT" = "true" ]; then
            args+=(--strict)
          fi
          if [ -n "$YAMLLINT_CONFIG_DATA" ]; then
            # Written to a file rather than passed via -d: -d only accepts a
            # single-line config, which cannot express per-rule overrides.
            printf '%s\n' "$YAMLLINT_CONFIG_DATA" > "${RUNNER_TEMP}/yamllint.yml"
            args+=(-c "${RUNNER_TEMP}/yamllint.yml")
          elif [ -f "$YAMLLINT_CONFIG" ]; then
            args+=(-c "$YAMLLINT_CONFIG")
          else
            echo "::warning title=yamllint config missing::${YAMLLINT_CONFIG} not found; falling back to yamllint's default ruleset"
          fi
          echo "::group::yamllint ${YAMLLINT_PATHS}"
          pipx run "yamllint==${YAMLLINT_VERSION}" "${args[@]}" "${paths[@]}"
          echo "::endgroup::"
          echo "::notice title=yamllint::No blocking findings in ${YAMLLINT_PATHS}"

