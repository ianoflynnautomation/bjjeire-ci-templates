name: Release

# Two shapes in one file — keep the jobs that match your repo.
#
# A) Single package: release-type + move-major-tag, for a repo whose consumers
#    pin a floating @v1 (this templates repo itself uses exactly this).
# B) Monorepo: manifest mode over several independently versioned packages,
#    then release-dispatch.yml to publish each package that actually released.
#
# Dispatching is a separate workflow because it needs `actions: write`, and a
# caller must grant the permission superset of every job in a called workflow.
# Keeping it separate means shape A never grants a permission it does not use.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/release-please.yml@v1
    with:
      release-type: simple
      move-major-tag: true

