name: Release

# Two shapes in one file — keep the job that matches your repo.
#
# A) Single package: release-type + move-major-tag, for a repo whose consumers
#    pin a floating @v1 (this templates repo itself uses exactly this).
# B) Monorepo: manifest mode over several independently versioned packages,
#    dispatching a publish workflow once per package that actually released.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/release-please.yml@v1
    with:
      release-type: simple
      move-major-tag: true

