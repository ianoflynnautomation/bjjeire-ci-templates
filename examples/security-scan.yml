name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — catches secrets added outside PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: Security
    permissions:
      contents: read
      pull-requests: write 
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/security-scan.yml@v1
    with:
      dependency-review-fail-on-severity: high
      dependency-review-comment-summary: on-failure
      sast-configs: "p/java p/typescript p/react"
      sast-severity: ERROR
      sast-enforce: false
      sast-upload-sarif: true
    secrets:
      gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}
