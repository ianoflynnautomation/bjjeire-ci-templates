name: 'Plan Playwright Matrix'
description: 'Expands a list of Playwright projects and a shard budget into a flat GitHub Actions matrix, one entry per project/shard pair. Supports per-project shard overrides (spend shards where the suite is slow) and a per-project config-file map, so a single matrix can span separate API and UI Playwright configs.'

inputs:
  projects:
    description: >-
      Newline- or comma-separated Playwright project names. Must match the
      project names declared in the Playwright config(s). Blank entries are
      ignored.
    required: true
  shard-total:
    description: 'Default shard count applied to every project without an override.'
    required: false
    default: '6'
  project-shard-overrides:
    description: >-
      Newline-separated `project=count` overrides. Projects not listed use
      shard-total. Use this to stop spending six shards on a suite with four
      tests. Example line: `api=3`.
    required: false
    default: ''
  config-map:
    description: >-
      Newline-separated `project=config-file` pairs selecting which Playwright
      config each project runs under. Projects not listed use default-config.
      Example line: `api=playwright.api.config.ts`.
    required: false
    default: ''
  default-config:
    description: 'Playwright config file used by any project absent from config-map.'
    required: false
    default: 'playwright.config.ts'
  summary-title:
    description: 'Heading used in the step summary. Empty (the default) skips the summary.'
    required: false
    default: ''

outputs:
  matrix:
    description: >-
      Flat JSON array, one object per project/shard pair, each
      `{ name, config, shard, shard_total }`. Consume with
      `matrix: { entry: fromJson(...) }` and reference `matrix.entry.name`.
      JSON keys are snake_case so they stay addressable with dot syntax in
      GitHub expressions.
    value: ${{ steps.plan.outputs.matrix }}
  projects:
    description: 'JSON array of `{ name, config, shard_total }`, one per project — the axis form, for callers that prefer a two-dimensional matrix.'
    value: ${{ steps.plan.outputs.projects }}
  job-count:
    description: 'Total number of matrix entries (project/shard pairs).'
    value: ${{ steps.plan.outputs.job-count }}
  project-count:
    description: 'Number of distinct projects planned.'
    value: ${{ steps.plan.outputs.project-count }}

runs:
  using: 'composite'
  steps:
    - name: Plan matrix
      id: plan
      shell: bash
      env:
        PROJECTS: ${{ inputs.projects }}
        SHARD_TOTAL: ${{ inputs.shard-total }}
        OVERRIDES: ${{ inputs.project-shard-overrides }}
        CONFIG_MAP: ${{ inputs.config-map }}
        DEFAULT_CONFIG: ${{ inputs.default-config }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/plan-matrix.sh"
    - name: Write summary
      if: inputs.summary-title != ''
      shell: bash
      env:
        TITLE: ${{ inputs.summary-title }}
        PLAN: ${{ steps.plan.outputs.projects }}
        JOB_COUNT: ${{ steps.plan.outputs.job-count }}
      run: |
        set -euo pipefail
        {
          echo "### ${TITLE}"
          echo ""
          echo "| Project | Shards | Config |"
          echo "| --- | ---: | --- |"
          jq -r '.[] | "| `\(.name)` | \(.shard_total) | `\(.config)` |"' <<< "$PLAN"
          echo ""
          echo "_${JOB_COUNT} shard job(s) total._"
        } >> "$GITHUB_STEP_SUMMARY"
