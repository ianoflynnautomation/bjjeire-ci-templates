name: 'OCI Tag Audit'
description: 'Asserts that a caller-supplied list of registry artifacts (repository + tag) actually exists in an OCI registry, so a manifest pinned to a tag that was never published fails CI instead of failing a deployment. Works against any Docker Registry v2 API (GHCR, Docker Hub, ACR, ECR, Quay) via the standard token challenge. Extracting the pins from your manifests is caller glue — this action only verifies them.'

inputs:
  artifacts:
    description: >-
      JSON array of the artifacts to verify. Each entry is an object with
      `repository` (path within the registry, e.g. "my-org/my-chart") and `tag`,
      plus optional `name` (label used in annotations, defaults to the
      repository) and `file` (source file, attached to annotations so the
      failure points at the manifest that holds the bad pin). An entry with an
      empty or null `tag` is reported as an unresolved pin, not a failure.
    required: true
  registry:
    description: 'Registry host to query, e.g. "ghcr.io", "docker.io", "myregistry.azurecr.io".'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Username for registry authentication. For GHCR with a GITHUB_TOKEN any value works; the actor is a sensible default.'
    required: false
    default: ${{ github.actor }}
  password:
    description: 'Password or token for registry authentication. Leave empty for anonymous pulls of public artifacts. For GHCR pass a token with packages: read.'
    required: false
    default: ''
  fail-on-missing:
    description: 'When "true", the action fails if any artifact is absent. Set "false" to report drift without blocking.'
    required: false
    default: 'true'
  summary-title:
    description: 'Heading used in the step summary. Set to an empty string to skip the summary.'
    required: false
    default: 'OCI tag audit'

outputs:
  checked-count:
    description: 'Number of artifacts whose tag was resolved and probed.'
    value: ${{ steps.audit.outputs.checked-count }}
  missing-count:
    description: 'Number of artifacts that could not be found in the registry.'
    value: ${{ steps.audit.outputs.missing-count }}
  missing:
    description: 'JSON array of the artifact references that were absent, e.g. ["ghcr.io/my-org/my-chart:0.1.11"].'
    value: ${{ steps.audit.outputs.missing }}
  unresolved-count:
    description: 'Number of entries whose tag was empty or null, i.e. a pin the caller could not extract.'
    value: ${{ steps.audit.outputs.unresolved-count }}

runs:
  using: 'composite'
  steps:
    - name: Audit registry tags
      id: audit
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        SUMMARY_TITLE: ${{ inputs.summary-title }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/audit-tags.sh"