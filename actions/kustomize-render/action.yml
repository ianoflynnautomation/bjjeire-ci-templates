name: 'Kustomize Render'
description: 'Builds a caller-supplied set of Kustomize directories (globs supported) into a flat output directory, one rendered YAML file per overlay. Directories without a kustomization file, or with an empty placeholder one, are skipped with an annotation instead of failing the run. Requires kustomize on PATH and the repo checked out.'

inputs:
  paths:
    description: >-
      Newline-separated list of Kustomize directories to build. Shell globs are
      expanded, so "kubernetes/apps/overlays/*" builds every overlay without
      naming clusters. Required — directory layouts are repo-specific and must
      never be baked in here.
    required: true
  output-dir:
    description: 'Directory the rendered manifests are written to. Created if missing.'
    required: false
    default: 'rendered'
  load-restrictor:
    description: 'Value for kustomize --load-restrictor. "LoadRestrictionsNone" allows overlays to reference files outside their own directory.'
    required: false
    default: 'LoadRestrictionsNone'
  kustomize-args:
    description: 'Extra arguments appended to every `kustomize build` invocation, e.g. "--enable-helm".'
    required: false
    default: ''
  fail-on-empty:
    description: 'When "true", fail if no directory produced output — protects against a typo in `paths` silently rendering nothing.'
    required: false
    default: 'true'
  summary-title:
    description: 'Heading used in the step summary. Set to an empty string to skip the summary.'
    required: false
    default: 'Kustomize render'

outputs:
  output-dir:
    description: 'Directory the manifests were written to — same as the `output-dir` input, for convenient chaining.'
    value: ${{ inputs.output-dir }}
  rendered-count:
    description: 'Number of directories that rendered successfully.'
    value: ${{ steps.render.outputs.rendered-count }}
  skipped-count:
    description: 'Number of matched directories skipped because they had no kustomization file or an empty one.'
    value: ${{ steps.render.outputs.skipped-count }}
  rendered-files:
    description: 'JSON array of the rendered file paths, e.g. ["rendered/kubernetes-apps-overlays-dev.yaml"].'
    value: ${{ steps.render.outputs.rendered-files }}

runs:
  using: 'composite'
  steps:
    - name: Build Kustomize overlays
      id: render
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        LOAD_RESTRICTOR: ${{ inputs.load-restrictor }}
        KUSTOMIZE_ARGS: ${{ inputs.kustomize-args }}
        FAIL_ON_EMPTY: ${{ inputs.fail-on-empty }}
        SUMMARY_TITLE: ${{ inputs.summary-title }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/build-overlays.sh"