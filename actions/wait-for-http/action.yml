name: 'Wait For HTTP'
description: 'Polls a URL until it answers with an accepted status class, then reports how long it took. Works on minimal container images: uses curl when present and falls back to python3, so jobs running in toolchain images that ship neither curl nor wget still get a reliable readiness gate.'

inputs:
  url:
    description: 'URL to poll.'
    required: true
  expect-status:
    description: >-
      Comma-separated accepted statuses. Entries are either exact codes (`200`)
      or classes (`2xx`, `3xx`). The first response matching any entry ends the
      wait.
    required: false
    default: '2xx,3xx'
  timeout-seconds:
    description: 'Give up after this many seconds.'
    required: false
    default: '120'
  interval-seconds:
    description: 'Delay between attempts.'
    required: false
    default: '2'
  request-timeout-seconds:
    description: 'Per-request timeout. Keep it at or below interval-seconds so a hanging endpoint does not stretch the overall budget.'
    required: false
    default: '3'
  method:
    description: 'HTTP method used for the probe.'
    required: false
    default: 'GET'
  insecure:
    description: 'Skip TLS certificate and hostname verification. Needed while cert-manager is still issuing a certificate for a freshly created hostname.'
    required: false
    default: 'false'
  headers:
    description: 'Newline-separated `Name: value` request headers (e.g. service-token headers for an authenticated health endpoint). Passed through the environment, never interpolated into a command.'
    required: false
    default: ''
  client:
    description: 'Probe implementation: auto | curl | python. "auto" prefers curl and falls back to python3.'
    required: false
    default: 'auto'
  fail-on-timeout:
    description: >-
      When "true" (default) a timeout fails the step. Set "false" to emit a
      warning and continue — use when the wait is a courtesy warm-up and the
      consumer retries on its own.
    required: false
    default: 'true'
  summary-title:
    description: 'Heading used in the step summary. Empty (the default) skips the summary.'
    required: false
    default: ''

outputs:
  ok:
    description: '"true" when an accepted status was observed within the timeout.'
    value: ${{ steps.probe.outputs.ok }}
  status:
    description: 'Last observed HTTP status code. "0" when every attempt failed to connect.'
    value: ${{ steps.probe.outputs.status }}
  elapsed-seconds:
    description: 'Seconds spent waiting.'
    value: ${{ steps.probe.outputs.elapsed }}
  attempts:
    description: 'Number of probe attempts made.'
    value: ${{ steps.probe.outputs.attempts }}

runs:
  using: 'composite'
  steps:
    - name: Wait for HTTP endpoint
      id: probe
      shell: bash
      env:
        URL: ${{ inputs.url }}
        EXPECT_STATUS: ${{ inputs.expect-status }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INTERVAL_SECONDS: ${{ inputs.interval-seconds }}
        REQUEST_TIMEOUT_SECONDS: ${{ inputs.request-timeout-seconds }}
        METHOD: ${{ inputs.method }}
        INSECURE: ${{ inputs.insecure }}
        HEADERS: ${{ inputs.headers }}
        CLIENT: ${{ inputs.client }}
        FAIL_ON_TIMEOUT: ${{ inputs.fail-on-timeout }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/wait-for-http.sh"
    - name: Write summary
      if: always() && inputs.summary-title != ''
      shell: bash
      env:
        TITLE: ${{ inputs.summary-title }}
        URL: ${{ inputs.url }}
        OK: ${{ steps.probe.outputs.ok }}
        STATUS: ${{ steps.probe.outputs.status }}
        ELAPSED: ${{ steps.probe.outputs.elapsed }}
        ATTEMPTS: ${{ steps.probe.outputs.attempts }}
      run: |
        {
          echo "### ${TITLE}"
          echo ""
          echo "| URL | Ready | Status | Elapsed | Attempts |"
          echo "| --- | --- | --- | --- | --- |"
          echo "| \`${URL}\` | ${OK:-false} | ${STATUS:-0} | ${ELAPSED:-0}s | ${ATTEMPTS:-0} |"
        } >> "$GITHUB_STEP_SUMMARY"
